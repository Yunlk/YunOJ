services:
  postgres:
    image: ${REGISTRY_PREFIX:-}postgres:16-alpine
    environment:
      POSTGRES_USER: yunoj
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-yunoj}
      POSTGRES_DB: yunoj
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U yunoj -d yunoj"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  redis:
    image: ${REGISTRY_PREFIX:-}redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile.api
      args:
        REGISTRY_PREFIX: ${REGISTRY_PREFIX:-}
    environment:
      DATABASE_URL: postgres://yunoj:${POSTGRES_PASSWORD:-yunoj}@postgres:5432/yunoj?sslmode=disable
      REDIS_ADDR: redis:6379
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      DATA_DIR: /data
      LANGUAGE_CONFIG: /config/languages.json
    volumes:
      - ./data:/data
      - ./config:/config:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        REGISTRY_PREFIX: ${REGISTRY_PREFIX:-}
    ports:
      - "${HTTP_PORT:-8080}:8080"
    depends_on:
      - backend
    restart: unless-stopped

  judge:
    build:
      context: .
      dockerfile: backend/Dockerfile.judge
      args:
        REGISTRY_PREFIX: ${REGISTRY_PREFIX:-}
    privileged: true
    environment:
      DATABASE_URL: postgres://yunoj:${POSTGRES_PASSWORD:-yunoj}@postgres:5432/yunoj?sslmode=disable
      REDIS_ADDR: redis:6379
      DATA_DIR: /data
      LANGUAGE_CONFIG: /config/languages.json
      JUDGE_WORKERS: ${JUDGE_WORKERS:-2}
      JUDGE_VERSION: ${JUDGE_VERSION:-dev}
      ISOLATE_PATH: /usr/local/bin/isolate
      ISOLATE_DIR: /var/local/lib/isolate
      ISOLATE_CG: ${ISOLATE_CG:-false}
    volumes:
      - ./data:/data
      - ./config:/config:ro
      - ./toolchains:/opt/toolchains:ro
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
